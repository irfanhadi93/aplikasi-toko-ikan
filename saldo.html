<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Saldo Toko</title>
  <link rel="stylesheet" href="css/saldostyle.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>
  <h1>Dashboard Saldo Toko</h1>

<div class="card">
    <h2>Grafik Saldo Toko</h2>
    <canvas id="grafikSaldotoko"></canvas>
  </div>
  <div class="card">
    <h2>Total Penjualan: <span id="totalPenjualan">Rp0</span></h2>
  </div>

  <div class="card">
    <h2>Total Pengeluaran: <span id="totalPengeluaran">Rp0</span></h2>
  </div>

  <div class="card">
    <h2>Total Pembelian: <span id="totalPembelian">Rp0</span></h2>
  </div>

  <div class="card saldo">
    <h2>Saldo Toko: <span id="saldoToko">Rp0</span></h2>
    <p>Terakhir Update: <span id="tanggalUpdate">--/--</span></p>
  </div>



  <!-- Script Saldo -->
  <script type="module" src="js/saldo.js"></script>

  <!-- Script Grafik Saldo -->
  <script type="module" src="js/grafik-saldo.js"></script>
</body>
</html>
