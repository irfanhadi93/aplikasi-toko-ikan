<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Penjualan Ikan</title>
  <link rel="stylesheet" href="css/jualstyle.css">
</head>
<body>
  <h1>Catatan Penjualan Ikan</h1>
  <p>Penjualan hari ini (<span id="tglhariini"></span>)</p>
<p>Total penjualan hari ini: <span id="totalpenjualanhariini">Rp 0</span></p>
<p>Total penjualanan: <span id="totalpenjualan">Rp 0</span></p>


  <!-- Form Penjualan -->
  <form id="formpenjualan">
    <label>Nama Ikan:</label><br>
    <select id="pilihikan" required>
      <option value="">-- Pilih Ikan --</option>
    </select><br><br>

    <label>Jumlah Penjualan (Rp):</label><br>
    <input type="number" name="uang" placeholder="0" required><br><br>

    <input type="submit" value="Tambah Penjualan">
  </form>

  <!-- Grafik Penjualan Harian -->
  <div class="container">
    <h2>Grafik Penjualan Harian</h2>
    <canvas id="grafikpenjualan"></canvas>
  </div>
  
  <h2>Stok Kolam</h2>
  <table border="1">
    <thead>
      <tr>
        <th>Nama Ikan</th>
        <th>Stok (kg)</th>
        <th>Harga Beli</th>
        <th>Harga Jual</th>
        <th>Nilai Stok</th>
        <th>Potensi Jual</th>
        <th>Laba</th>
      </tr>
    </thead>
    <tbody id="tabelstok"></tbody>
  </table>

  <h2>Riwayat Penjualan</h2>
  <ul id="riwayatpenjualan"></ul>

 

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

  <!-- Module JS -->
  <script type="module" src="js/jual.js"></script>
  <script type="module" src="js/grafik-penjualan.js"></script>
</body>
</html>
