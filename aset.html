<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Total Aset</title>
  <link rel="stylesheet" href="css/asetstyle.css">
</head>
<body>
  <h1>Dashboard Total Aset</h1>

  <!-- Card ringkas untuk total -->
  <div class="card">
    <h3>Saldo Toko: <span id="saldoToko">-</span></h3>
    <h3>Total Stok Kolam:  <span id="totalStok">- </span></h3>
    <h3>Total Potensi Jual Stok: <span id="totalPotensiJual">-</span></h3>
    <h3>Total Aset: <span id="totalAset">-</span></h3>
  </div>

  <!-- Card ringkas untuk daftar stok -->
  <div class="card">
    <h3>Stok Kolam</h3>
    <ul id="daftarStok"></ul>
  </div>

 <script type="module" src="js/aset.js"></script>
  
</body>
</html>
